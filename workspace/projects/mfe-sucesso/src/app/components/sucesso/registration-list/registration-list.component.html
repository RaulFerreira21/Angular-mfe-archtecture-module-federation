<div class="container">
    <mat-card class="card-table" *ngIf="dataUsers.length >0; else noUsers">
        <mat-card-header>
            Usuários cadastrados até o momento
        </mat-card-header>
        <mat-card-content>
            <table mat-table [dataSource]="dataUsers" class="mat-elevation-z7">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Nome</th>
                    <td mat-cell *matCellDef="let element">{{element.name}}</td>
                </ng-container>
                
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef>Email</th>
                    <td mat-cell *matCellDef="let element">{{element.email}}</td>
                </ng-container>
        
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </mat-card-content>
        <mat-card-actions>
            <a mat-button color="primary" [routerLink]="'/cadastro'">Adicionar novo Usuário</a>
        </mat-card-actions>
    </mat-card>
</div>

<ng-template #noUsers>
    <mat-card class="card-no-users">
        <mat-card-header>
            Sem usários cadastrados no momento
        </mat-card-header>
        <mat-card-actions>
            <a mat-button color="primary" [routerLink]="'/cadastro'">Adicionar novo Usuário</a>
            <a mat-button color="primary" [routerLink]="'/'">Voltar ao início</a>
        </mat-card-actions>
    </mat-card>
</ng-template>
